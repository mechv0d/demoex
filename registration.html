<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя семья - мой космос Регистрация</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reg.css">
</head>
<body class="dark-theme">
<header>
    <div class="logo">Моя семья - мой космос</div>
    <nav>
        <a href="index.html">Главная</a>
        <a href="account.html">Личный кабинет</a>
        <a href="#contacts">Контакты</a>
        <button class="theme-toggle">Светлая тема</button>
    </nav>
</header>

<main>
    <h1>Регистрация</h1>

    <form class="registration-form">
        <div class="form-group">
            <label>Email *</label>
            <input type="email" required>
        </div>

        <div class="form-group">
            <label>Имя *</label>
            <input type="text" required>
        </div>

        <div class="form-group">
            <label>Фамилия *</label>
            <input type="text" required>
        </div>

        <div class="form-group">
            <label>Возраст *</label>
            <input type="number" min="1" max="120" placeholder="Возраст цифрой">
            <input type="text" placeholder="Возраст текстом">
        </div>

        <div class="form-group">
            <label>Пол *</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="gender" value="male" required>
                    Мужской
                </label>
                <label>
                    <input type="radio" name="gender" value="female" required>
                    Женский
                </label>
            </div>
        </div>

        <div class="form-group">
            <label>Пароль *</label>
            <input type="password" required>
        </div>

        <div class="form-group">
            <label>Повтор пароля *</label>
            <input type="password" required>
        </div>

        <div class="form-group">
            <label>Семейная фотография *</label>
            <div class="photo-upload">
                <div class="upload-area">Область для загрузки фото</div>
            </div>
        </div>

        <div class="family-members">
            <h3>Члены семьи</h3>
            <div class="member-fields">
                <div class="member-group">
                    <input type="text" placeholder="Фамилия">
                    <input type="text" placeholder="Имя">
                    <input type="number" placeholder="Возраст">
                    <select>
                        <option value="">Пол</option>
                        <option value="male">Мужской</option>
                        <option value="female">Женский</option>
                    </select>
                    <button type="button" class="remove-member">Удалить</button>
                </div>
            </div>
            <button type="button" class="add-member">Добавить члена семьи</button>
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" required>
                Согласие на обработку персональных данных *
            </label>
        </div>

        <button type="submit" class="submit-btn">Зарегистрироваться</button>
    </form>
</main>

<footer id="contacts">
    <div class="contacts">
        <a href="tel:+79339336969">+7 933 933 69 69</a>
        <a href="mailto:family@cosmos.ru">family@cosmos.ru</a>
    </div>
    <nav>
        <a href="index.html">Главная</a>
        <a href="index-light.html">Светлая тема</a>
        <a href="registration.html">Регистрация</a>
        <a href="competition.html">Конкурс</a>
        <a href="account.html">Личный кабинет</a>
        <a href="404.html">Страница не найдена</a>
    </nav>
</footer>
</body>
</html>
